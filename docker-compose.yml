# 미니PC 운영용. 외부 공개는 Cloudflare Tunnel(cloudflared)이 api:3000으로 연결한다.
# 사용: cp .env.example .env.production && (값 채우기)
#       docker compose --env-file .env.production up -d --build
# .env.production 하나에 compose 변수(POSTGRES_*, MINIO_*)와 앱 변수를 함께 둔다.
name: cassette

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cassette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 정해 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-cassette}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cassette}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD를 정해 주세요}
    volumes:
      - minio-data:/data
    # 콘솔은 미니PC 안에서만 연다. 9000(S3 API)은 Cloudflare Tunnel이 files.<도메인>으로 공개한다
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-cassette}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cassette}
      REDIS_URL: redis://redis:6379
      # 녹음 파일. 앱은 presigned URL로 MinIO에 직접 올리고 받는다.
      # S3_PUBLIC_ENDPOINT는 Cloudflare Tunnel로 minio:9000을 공개한 주소 (예: https://files.<도메인>)
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT를 정해 주세요}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-cassette}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-cassette}
      S3_CREATE_BUCKET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Cloudflare Tunnel이 같은 호스트에서 붙는다. 외부 포트는 열지 않는다
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
